name: Deploy to GitHub Pages

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect deployable files
        run: |
          # Despite .gitignore, we explicitly force-add the files needed for Pages
          git add -f index.html
          git add -f data/projects.json
          git add -f data/raw/$(date +%Y-%m-%d)/ 2>/dev/null || true
          git add -f README.md
          git add -f assets/

      - name: Commit and push
        run: |
          git config user.name "ai-inspiration-bot"
          git config user.email "bot@ai-inspiration.dev"
          git diff --cached --quiet || git commit -m "Deploy: $(date +%Y-%m-%d)"
          git push
